name: Review experimental chapters
on:
  push:
    branches: [thesis-evidence]
    paths: ['.github/workflows/thesis-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pymupdf
      - name: Inspect revised pages and original experiment specification
        shell: python
        run: |
          import base64
          import fitz
          from pathlib import Path
          root=Path('毕业论文')
          paper=fitz.open(root/'小论文.pdf')
          for page in paper:
              print('PAPER_TEXT',page.number,page.get_text().replace('\n',' '))
          doc=fitz.open(next(root.glob('毕业论文初稿*.pdf')))
          print('DOC_PAGES',len(doc))
          for page in doc:
              text=''.join(page.get_text().split())
              if any(s in text for s in ['多前缀信号与修复前后差异的独立贡献','相同时间预算下不确定性奖励的独立贡献']):
                  print('REVISED_PAGE',page.number+1)
                  pix=page.get_pixmap(matrix=fitz.Matrix(.85,.85))
                  jpg=pix.tobytes('jpeg',jpg_quality=68)
                  data=base64.b64encode(jpg).decode()
                  for i in range(0,len(data),1200):
                      print('PREVIEW',page.number,i,data[i:i+1200])
