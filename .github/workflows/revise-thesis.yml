name: Revise thesis and check layout
on:
  push:
    branches: [thesis-evidence]
    paths: ['.github/workflows/revise-thesis.yml']
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install typesetting tools
        run: |
          python -m pip install lxml pymupdf pillow
          if ! command -v libreoffice || ! fc-list :lang=zh | grep -q .; then
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo apt-get install --no-install-recommends -y -qq libreoffice-writer fonts-noto-cjk
          fi
      - name: Revise and verify the manuscript
        shell: python
        run: |
          from pathlib import Path
          import re,zipfile,subprocess,tempfile,base64
          from lxml import etree as E
          import fitz
          D=next(Path('毕业论文').glob('毕业论文初稿*.docx'))
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          W='{'+ns['w']+'}'
          with zipfile.ZipFile(D) as z:parts={n:z.read(n) for n in z.namelist()}
          root=E.fromstring(parts['word/document.xml'])
          ps=root.find('w:body',ns).findall('w:p',ns)
          def txt(p):return ''.join(p.xpath('.//w:t/text()',namespaces=ns))
          def append(p,s):p.xpath('./w:r/w:t',namespaces=ns)[-1].text+=s
          append(ps[75]," Reporting both outcomes makes it possible to identify cases where testing a disputed candidate consumes time needed for a correct alternative.")
          assert len(txt(ps[73]).split()+txt(ps[74]).split()+txt(ps[75]).split())>=300
          append(ps[68],"因此，评价同时关注排序改善的来源，以及耗时相近时验证次序改变所带来的修复得失。")
          assert txt(ps[368]).startswith('3.6') and txt(ps[446]).startswith('4.6')
          append(ps[369],"在这一设置下，注意力权重反映各采样位置对评分的相对贡献。检验修复差异的作用应固定采样位置和训练标签，比较加入差异表征前后首个正确候选的名次。")
          append(ps[447],"若高分歧主要来自评分器对陌生项目的共同失准，给予这类候选更高优先级可能耗尽验证时间。因而需要同时记录原策略能修复而联合策略未修复的缺陷，并检查最后一个完成和第一个未完成的候选。")
          def save():
              parts['word/document.xml']=E.tostring(root,encoding='UTF-8',xml_declaration=True,standalone=True)
              with zipfile.ZipFile(D,'w',zipfile.ZIP_DEFLATED) as z:
                  for n,b in parts.items():z.writestr(n,b)
          def render():
              with tempfile.TemporaryDirectory() as t:
                  subprocess.run(['libreoffice','-env:UserInstallation=file://'+t+'/profile','--headless','--convert-to','pdf','--outdir',t,str(D)],check=True)
                  D.with_suffix('.pdf').write_bytes((Path(t)/(D.stem+'.pdf')).read_bytes())
          save();render()
          # Update cached page numbers in the contents and lists against the rendered body.
          compact=lambda s:re.sub(r'[\s\u3000]+','',s)
          pdf=fitz.open(D.with_suffix('.pdf'));pages=[compact(p.get_text()) for p in pdf];pdf.close()
          start=next(i for i,p in enumerate(pages) if compact(txt(ps[219]))[:22] in p)
          unmatched=[];changed=0
          for i,p in enumerate(ps[79:217],79):
              ts=p.xpath('.//w:t',namespaces=ns)
              if len(ts)<2 or not (ts[-1].text or '').isdigit():continue
              label=compact(''.join(t.text or '' for t in ts[:-1])); old=int(ts[-1].text)
              hits=[j for j in range(start,len(pages)) if label in pages[j]]
              if not hits:unmatched.append(i);continue
              j=min(hits,key=lambda j:abs(j-start+1-old));new=str(j-start+1)
              changed+=new!=ts[-1].text;ts[-1].text=new
          if changed:save();render()
          pdf=fitz.open(D.with_suffix('.pdf'));pages=[compact(p.get_text()) for p in pdf]
          for i,p in enumerate(ps[79:217],79):
              ts=p.xpath('.//w:t',namespaces=ns)
              if len(ts)<2 or not (ts[-1].text or '').isdigit():continue
              key=compact(''.join(t.text or '' for t in ts[:-1]))
              assert key in pages[start+int(ts[-1].text)-1],('page reference',i)
          assert not unmatched
          abstract_pages=[]
          for beg,end in [(68,71),(73,76)]:
              page=next(j for j,p in enumerate(pages) if compact(txt(ps[beg]))[:25] in p)
              assert compact(txt(ps[end]))[-15:] in pages[page],('abstract overflow',beg)
              abstract_pages.append(page)
          print('FINAL_QA',len(pdf),len(txt(ps[73]).split()+txt(ps[74]).split()+txt(ps[75]).split()),abstract_pages,changed)
          for sec in root.xpath('//w:sectPr',namespaces=ns):
              m=sec.find(W+'pgMar')
              if m is not None:print('MARGINS',[m.get(W+k) for k in ('left','right','top','bottom')])
          # Render only anonymised block geometry for layout inspection.
          from PIL import Image,ImageDraw
          marked=abstract_pages+[start,len(pdf)-7]
          sheet=Image.new('RGB',(200*len(marked),284),'white')
          draw=ImageDraw.Draw(sheet)
          for col,j in enumerate(marked):
              page=pdf[j];scale=194/page.rect.width
              for x0,y0,x1,y1,*_ in page.get_text('blocks'):
                  draw.rectangle((col*200+x0*scale, y0*scale, col*200+x1*scale,y1*scale),fill='#b8c3cd')
          import io
          buf=io.BytesIO();sheet.save(buf,format='PNG')
          print('GEOMETRY',base64.b64encode(buf.getvalue()).decode())
      - name: Save revised Word and PDF
        run: |
          git add -- 毕业论文/*.docx 毕业论文/*.pdf
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Revise novelty claims, update sources and refresh formatted thesis'
          git push origin HEAD:thesis-evidence
