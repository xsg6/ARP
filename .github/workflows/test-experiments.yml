name: Check experiment implementation
on:
  push:
    branches: [thesis-evidence]
    paths: ['experiments/**', '.github/workflows/test-experiments.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pandas scipy scikit-learn matplotlib 'transformers>=4.46,<5'
      - run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python experiments/check_pipeline.py --paper
      - run: OMP_NUM_THREADS=1 python experiments/check_models.py
