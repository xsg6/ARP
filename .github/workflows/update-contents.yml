name: Update thesis contents
on:
  push:
    branches: [thesis-evidence]
    paths: ['.github/workflows/update-contents.yml']
permissions:
  contents: write
jobs:
  revision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install typesetting tools
        run: |
          python -m pip install lxml pymupdf
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq libreoffice-writer fonts-noto-cjk
      - name: Update headings and verify the contents against the PDF
        shell: python
        run: |
          from pathlib import Path
          from copy import deepcopy
          from lxml import etree as E
          import fitz,re,tempfile,zipfile,subprocess
          D=next(Path("毕业论文").glob("毕业论文初稿*.docx"))
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          with zipfile.ZipFile(D) as z: parts={n:z.read(n) for n in z.namelist()}
          root=E.fromstring(parts["word/document.xml"]);body=root.find(W+"body")
          def ts(p):return list(p.iter(W+"t"))
          def text(p):return "".join(t.text or "" for t in ts(p))
          def style(p):
              s=p.find(W+"pPr/"+W+"pStyle")
              return "" if s is None else s.get(W+"val","")
          def compact(s):return re.sub(r"\s+","",s)
          def entries():
              return [p for p in body.findall(W+"p") if len(ts(p))>=2 and (ts(p)[-1].text or "").isdigit() and any(True for _ in p.iter(W+"tab"))]
          def label(p):return "".join(t.text or "" for t in ts(p)[:-1])
          def settitle(p,title,cache=False):
              nodes=ts(p)[:-1] if cache else ts(p)
              nodes[0].text=title
              for t in nodes[1:]:t.text=""
          def clone(p):
              q=deepcopy(p)
              for name in ["bookmarkStart","bookmarkEnd"]:
                  for elem in q.iter(W+name):elem.getparent().remove(elem)
              return q
          def num(p):return re.match(r"[1-7](?:\.\d+)+",text(p)).group()
          ps=body.findall(W+"p")
          h={num(p):p for p in ps if style(p) in ("Heading2","Heading3") and re.match(r"[1-7]\.",text(p))}
          en={compact(label(p)):p for p in entries()}
          toc={k:en[compact(text(p))] for k,p in h.items()}
          bodytext=compact(text(h["1.1"].getnext()))[:28]
          count=lambda:[sum(style(p)==s and re.match(r"[1-7]\.",text(p)) is not None for p in body.findall(W+"p")) for s in ("Heading2","Heading3")]
          before=count()
          id_by_node={p:k for k,p in h.items()}
          for p in ps:
              for old,i in [('第五章','5'),('第六章','6'),('第七章','7')]:
                  if style(p)=='Heading1' and text(p).startswith(old):
                      id_by_node[p]=i;h[i]=p;toc[i]=en[compact(text(p))]
          sections={}
          for node in list(body)[body.index(h['5']):body.index(h['7'])]:
              if node in id_by_node:
                  active=id_by_node[node];sections[active]=[]
              else:
                  sections[active].append(node)
          # Keep the two experiments' protocols and their evidence status distinct within one chapter.
          plan=[
          ('5','补丁排序与预算验证的实验评估',['5','6']),
          ('5.1','实验设置与评价指标',['5.1','6.1']),
          ('5.1.1','缺陷数据、候选池与项目划分',['5.1.1','6.1.2','6.1.3']),
          ('5.1.2','正确性标注、训练与对照方法',['5.1.2','5.1.3','6.1.4']),
          ('5.1.3','研究问题、时间预算与运行环境',['6.1.1','6.2','6.2.1','6.2.2','6.2.3']),
          ('5.1.4','评价指标与配对统计方法',['6.3','6.3.1','6.3.2','6.3.3']),
          ('5.2','多前缀补丁排序的实验评估',['5.2']),
          ('5.2.1','正确性判别、首个正确补丁排名与命中率',['5.2.1','5.2.2']),
          ('5.2.2','修复差异与多前缀表征的消融分析',['5.3','5.3.1','5.3.2']),
          ('5.2.3','固定选择策略的验证开销与正确候选保留率',['5.2.3','5.4','5.4.1']),
          ('5.2.4','语义注入的探索性实验',['5.4.2']),
          ('5.3','不确定性与成本联合调度的评估设计',[]),
          ('5.3.1','相同时间预算下的正确补丁返回率',['6.2.4','6.3.4']),
          ('5.3.2','分歧奖励与验证成本估计的消融设计',['6.2.5','6.2.6']),
          ('5.3.3','新增修复与失去修复的缺陷案例分析方案',['6.4','6.4.1']),
          ('5.4','有效性威胁与本章小结',[]),
          ('5.4.1','跨项目泛化与复现条件',['6.4.2','6.4.3']),
          ('5.4.2','有效性威胁与研究问题小结',['5.4.3'])]
          mapping={old:new for new,title,keys in plan for old in keys}
          assert set(mapping)==set(sections),(set(sections)-set(mapping),set(mapping)-set(sections))
          tp={i:clone(h[k]) for i,k in enumerate(['5','5.1','5.1.1'],1)}
          te={i:clone(toc[k]) for i,k in enumerate(['5','5.1','5.1.1'],1)}
          anchor=h['7'];tocanchor=toc['7']
          for node in list(body)[body.index(h['5']):body.index(anchor)]:body.remove(node)
          for k in sections:body.remove(toc[k])
          def para(content):
              p=E.Element(W+'p');E.SubElement(E.SubElement(p,W+'r'),W+'t').text=content;return p
          for new,title,keys in plan:
              level=new.count('.')+1;title=('第五章' if level==1 else new)+'　'+title
              p=clone(tp[level]);settitle(p,title);anchor.addprevious(p)
              e=clone(te[level]);settitle(e,title,True);tocanchor.addprevious(e)
              for k in keys:
                  for node in sections[k]:
                      anchor.addprevious(node)
              if new=='5':
                  anchor.addprevious(para('本章在同一候选池上考察两个问题。第一，修复差异与多前缀状态对缺陷内排序有何贡献；第二，在给定时间内，模型分歧能否提高最终返回正确补丁的比例。第5.2节区分前期已报告的结果与尚待运行的对照，第5.3节给出联合调度的验证方案。'))
              if new=='5.2.2':
                  anchor.addprevious(para('其中，前期稿件已报告末位置与多前缀融合的差异。完整融合相对固定末层多位置基线的增益仍需四组配对对照检验。'))
              if new=='5.3':
                  anchor.addprevious(para('本节给出已实现调度策略的比较方案。各项分析均需在完成正确性标注并具备逐候选耗时的测试缺陷上执行。下列结果表保留待测状态。'))
              if new=='5.4.2':
                  anchor.addprevious(para('综合两组研究问题，前期结果提供了多前缀信息改善候选排序的初步证据。相同时间预算下，分歧奖励能否在概率与预计成本之比的基础上提高最终修复率，仍需通过逐缺陷比较确定。'))
          for k in list(h):
              if k=='7' or k.startswith('7.'):
                  title=text(h[k]).replace('第七章','第六章',1) if k=='7' else re.sub('^7','6',text(h[k]))
                  settitle(h[k],title);settitle(toc[k],title,True)
                  mapping[k]='6'+k[1:]
          # Rebuild chapter-based figure/table identifiers from caption order, preserving table contents.
          pat=re.compile(r'([图表])\s*([56])\s*([.．－-])\s*(\d+)')
          cap={}
          for p in body.findall(W+'p'):
              if p in entries() or style(p).startswith('TOC'):continue
              m=pat.match(text(p))
              if not m:continue
              if ('Caption' not in style(p) and '题' not in style(p) and '题注' not in style(p)):continue
              key=(m[1],m[2],m[4])
              if key not in cap:cap[key]=str(1+sum(x[0]==m[1] for x in cap))
          affected=[]
          for p in body.findall(W+'p'):
              for m in pat.finditer(text(p)):
                  affected.append((m[1],m[2],m[4]))
          assert all(k in cap for k in affected),('missing caption',set(affected)-set(cap))
          original=list(ps[0:0])
          # Restrict section-reference renumbering to original text, excluding new orientation paragraphs.
          original=set(ps)
          for p in root.iter(W+'p'):
              for n in ts(p):
                  v=n.text or ''
                  v=pat.sub(lambda m:m[1]+'5'+m[3]+cap[(m[1],m[2],m[4])],v)
                  if not style(p).startswith(('Heading','TOC')) and p in original:
                      v=re.sub(r'第([五六七])章',lambda m:'第'+{'五':'五','六':'五','七':'六'}[m[1]]+'章',v)
                      v=re.sub(r'(第|见|参见)([567](?:\.\d+){1,2})(?=小?节)',lambda m:m[1]+mapping.get(m[2],m[2]),v)
                      v=v.replace('七章正文','六章正文').replace('共七章','共六章').replace('分为七章','分为六章')
                  n.text=v
          # Replace the original chapter roadmap with one paragraph describing the six-chapter sequence.
          for p in ps:
              s=text(p)
              if style(p)=='' and '第一章' in s and '第二章' in s and '第三章' in s and '第五章' in s:
                  settitle(p,'全文共六章。第一章提出研究问题；第二章介绍补丁验证基础与评价指标；第三章研究多前缀补丁排序；第四章研究不确定性与验证成本联合调度；第五章统一实验设置，分别讨论排序结果、消融对照和预算调度评估方案；第六章总结研究结论、局限与展望。')
          for p in root.iter(W+'p'):
              for n in ts(p):
                  if n.text:n.text=n.text.replace('下一章据此布置新增方法的实验协议','本章后续给出联合调度的实验协议')
          assert not any('第七章' in text(p) for p in body.findall(W+'p'))
          def save():
              parts["word/document.xml"]=E.tostring(root,encoding="utf-8",xml_declaration=True,standalone=True)
              with zipfile.ZipFile(D,"w",zipfile.ZIP_DEFLATED) as z:
                  for k,v in parts.items():z.writestr(k,v)
          def render():
              with tempfile.TemporaryDirectory() as t:
                  subprocess.run(["libreoffice","-env:UserInstallation=file://"+t+"/profile","--headless","--convert-to","pdf","--outdir",t,str(D)],check=True)
                  D.with_suffix(".pdf").write_bytes((Path(t)/(D.stem+".pdf")).read_bytes())
              with fitz.open(D.with_suffix(".pdf")) as pdf:return [compact(p.get_text()) for p in pdf]
          for iteration in range(5):
              save();pages=render()
              start=next(i for i,p in enumerate(pages) if bodytext in p)
              changed=0
              for p in entries():
                  key=compact(label(p));t=ts(p)[-1];old=int(t.text)
                  hits=[j-start+1 for j in range(start,len(pages)) if key in pages[j]]
                  if not hits:raise ValueError("missing contents match: "+key)
                  new=min(hits,key=lambda j:abs(j-old));changed+=new!=old;t.text=str(new)
              if not changed:break
          else:raise RuntimeError("page fields unstable")
          assert all(len(p)>12 for p in pages)
          headings=[compact(text(p)) for p in body.findall(W+"p") if style(p) in ("Heading2","Heading3") and re.match(r"[1-7]\.",text(p))]
          toclabels=[compact(label(p)) for p in entries() if re.match(r"[1-7]\.",label(p))]
          assert headings==toclabels and len(headings)==len(set(headings))
          print("FINAL",count(),len(pages),len(entries()),len(cap))
      - name: Commit formatted draft
        run: |
          git add -- 毕业论文/*.docx 毕业论文/*.pdf
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Align thesis contents and experimental sections with both research questions'
          git push origin HEAD:thesis-evidence
