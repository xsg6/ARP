name: Update thesis contents
on:
  push:
    branches: [thesis-evidence]
    paths: ['.github/workflows/update-contents.yml']
permissions:
  contents: write
jobs:
  revision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install typesetting tools
        run: |
          python -m pip install lxml pymupdf
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq libreoffice-writer fonts-noto-cjk
      - name: Update headings and verify the contents against the PDF
        shell: python
        run: |
          from pathlib import Path
          from copy import deepcopy
          from lxml import etree as E
          import fitz,re,tempfile,zipfile,subprocess
          D=next(Path("毕业论文").glob("毕业论文初稿*.docx"))
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          with zipfile.ZipFile(D) as z: parts={n:z.read(n) for n in z.namelist()}
          root=E.fromstring(parts["word/document.xml"]);body=root.find(W+"body")
          def ts(p):return list(p.iter(W+"t"))
          def text(p):return "".join(t.text or "" for t in ts(p))
          def style(p):
              s=p.find(W+"pPr/"+W+"pStyle")
              return "" if s is None else s.get(W+"val","")
          def compact(s):return re.sub(r"\s+","",s)
          def entries():
              return [p for p in body.findall(W+"p") if len(ts(p))>=2 and (ts(p)[-1].text or "").isdigit() and any(True for _ in p.iter(W+"tab"))]
          def label(p):return "".join(t.text or "" for t in ts(p)[:-1])
          def settitle(p,title,cache=False):
              nodes=ts(p)[:-1] if cache else ts(p)
              nodes[0].text=title
              for t in nodes[1:]:t.text=""
          def clone(p):
              q=deepcopy(p)
              for name in ["bookmarkStart","bookmarkEnd"]:
                  for elem in q.iter(W+name):elem.getparent().remove(elem)
              return q
          def num(p):return re.match(r"[1-7](?:\.\d+)+",text(p)).group()
          ps=body.findall(W+"p")
          h={num(p):p for p in ps if style(p) in ("Heading2","Heading3") and re.match(r"[1-7]\.",text(p))}
          en={compact(label(p)):p for p in entries()}
          toc={k:en[compact(text(p))] for k,p in h.items()}
          bodytext=compact(text(h["1.1"].getnext()))[:28]
          count=lambda:[sum(style(p)==s and re.match(r"[1-7]\.",text(p)) is not None for p in body.findall(W+"p")) for s in ("Heading2","Heading3")]
          before=count()
          # Single-section groups retain their titles. Merged topics inherit the existing subsection sequence.
          plan={
          1:[([1],None),([2],None),([3,4],"研究问题与论文安排")],
          2:[([1,2],"补丁验证任务与代码表征"),([3,4],"候选评分与不确定性估计"),([5,6],"验证预算与评价指标")],
          3:[([1,2],"排序问题与候选构造"),([3,4],"多源表征融合与排序模型训练"),([5,6],"预算验证与方法适用条件")],
          4:[([1,2],"调度问题与候选正确性估计"),([3],"候选验证耗时预测"),([4,5,6],"预算调度、补丁返回与适用条件")],
          5:[([1],None),([2,3,4],"正确性判别、排序效果与验证成本"),([5],None),([6,7],"计算开销、扩展实验与有效性分析")],
          6:[([1,2],"研究问题与实验数据"),([3,4],"预算设置与调度策略对照"),([5,6],"评价指标与统计分析"),([7],None)],
          7:[([1],None),([2],None),([3],None)]}
          mapping={}
          template3=clone(h["1.2.1"]); template_t3=clone(toc["1.2.1"])
          def rest(k):return re.sub(r"^[\d.]+\s*","",text(h[k]))
          def setlevel(p,proto):
              prev=p.find(W+"pPr")
              if prev is not None:p.remove(prev)
              p.insert(0,deepcopy(proto.find(W+"pPr")))
          def apply(k,new,title):
              p,e=h[k],toc[k];t=new+"　"+title
              settitle(p,t);settitle(e,t,True);mapping[k]=new
          for ch,groups in plan.items():
              for idx,(olds,title) in enumerate(groups,1):
                  new=f"{ch}.{idx}";first=f"{ch}.{olds[0]}"
                  if len(olds)==1:
                      apply(first,new,title or rest(first))
                  else:
                      hp,ep=clone(h[first]),clone(toc[first])
                      t=new+"　"+title
                      settitle(hp,t);settitle(ep,t,True)
                      h[first].addprevious(hp);toc[first].addprevious(ep)
                  sub=0
                  for o in olds:
                      k=f"{ch}.{o}";children=[key for key in h if key.startswith(k+".")]
                      if len(olds)>1 and children:
                          mapping[k]=new
                          body.remove(h[k]);body.remove(toc[k])
                      elif len(olds)>1:
                          sub+=1
                          setlevel(h[k],template3);setlevel(toc[k],template_t3)
                          apply(k,f"{new}.{sub}",rest(k))
                      for child in children:
                          sub+=1
                          apply(child,f"{new}.{sub}",rest(child))
          assert set(mapping)==set(h)
          # Only renumber explicit references to sections; figure, table and equation IDs stay independent.
          for p in root.iter(W+"p"):
              if style(p).startswith(("Heading","TOC")):continue
              for t in ts(p):
                  t.text=re.sub(r"(?P<pre>第\s*|见\s*|参见\s*|如\s*)(?P<n>[1-7](?:\.\d+){1,2})(?=\s*(?:小?节))",
                      lambda m:m["pre"]+mapping.get(m["n"],m["n"]),t.text or "")
          after=count();assert after[0]<before[0] and after[1]>before[1]
          def save():
              parts["word/document.xml"]=E.tostring(root,encoding="utf-8",xml_declaration=True,standalone=True)
              with zipfile.ZipFile(D,"w",zipfile.ZIP_DEFLATED) as z:
                  for k,v in parts.items():z.writestr(k,v)
          def render():
              with tempfile.TemporaryDirectory() as t:
                  subprocess.run(["libreoffice","-env:UserInstallation=file://"+t+"/profile","--headless","--convert-to","pdf","--outdir",t,str(D)],check=True)
                  D.with_suffix(".pdf").write_bytes((Path(t)/(D.stem+".pdf")).read_bytes())
              with fitz.open(D.with_suffix(".pdf")) as pdf:return [compact(p.get_text()) for p in pdf]
          for iteration in range(5):
              save();pages=render()
              start=next(i for i,p in enumerate(pages) if bodytext in p)
              changed=0
              for p in entries():
                  key=compact(label(p));t=ts(p)[-1];old=int(t.text)
                  hits=[j-start+1 for j in range(start,len(pages)) if key in pages[j]]
                  if not hits:raise ValueError("missing contents match: "+key)
                  new=min(hits,key=lambda j:abs(j-old));changed+=new!=old;t.text=str(new)
              if not changed:break
          else:raise RuntimeError("page fields unstable")
          assert all(len(p)>12 for p in pages)
          headings=[compact(text(p)) for p in body.findall(W+"p") if style(p) in ("Heading2","Heading3") and re.match(r"[1-7]\.",text(p))]
          toclabels=[compact(label(p)) for p in entries() if re.match(r"[1-7]\.",label(p))]
          assert headings==toclabels and len(headings)==len(set(headings))
          print("FINAL",before,after,len(pages),len(entries()))
      - name: Commit formatted draft
        run: |
          git add -- 毕业论文/*.docx 毕业论文/*.pdf
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Align thesis contents and experimental sections with both research questions'
          git push origin HEAD:thesis-evidence
