name: Update thesis contents
on:
  push:
    branches: [thesis-evidence]
    paths: ['.github/workflows/update-contents.yml']
permissions:
  contents: write
jobs:
  revision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install typesetting tools
        run: |
          python -m pip install lxml pymupdf
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq libreoffice-writer fonts-noto-cjk
      - name: Update headings and verify the contents against the PDF
        shell: python
        run: |
          from pathlib import Path
          from copy import deepcopy
          from lxml import etree as E
          import fitz,re,tempfile,zipfile,subprocess
          D=next(Path("毕业论文").glob("毕业论文初稿*.docx"))
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          with zipfile.ZipFile(D) as z: parts={n:z.read(n) for n in z.namelist()}
          root=E.fromstring(parts["word/document.xml"]);body=root.find(W+"body")
          def ts(p):return list(p.iter(W+"t"))
          def text(p):return "".join(t.text or "" for t in ts(p))
          def style(p):
              s=p.find(W+"pPr/"+W+"pStyle")
              return "" if s is None else s.get(W+"val","")
          def compact(s):return re.sub(r"\s+","",s)
          ps=body.findall(W+"p")
          head={compact(text(p)).split("章")[0] if style(p)=="Heading1" else re.match(r"[\d.]+",text(p)).group():p for p in ps if (style(p)=="Heading1" and re.match("第.+章",text(p))) or (style(p) in {"Heading2","Heading3"} and re.match(r"[\d.]+",text(p)))}
          def entries():
              return [p for p in body.findall(W+"p") if len(ts(p))>=2 and (ts(p)[-1].text or "").isdigit() and any(True for _ in p.iter(W+"tab"))]
          def label(p):return "".join(t.text or "" for t in ts(p)[:-1])
          def replace_title(p,title,cache=False):
              nodes=ts(p)[:-1] if cache else ts(p)
              nodes[0].text=title
              for t in nodes[1:]:t.text=""
          def entry(title):return next(p for p in entries() if compact(label(p))==compact(title))
          names={
          '第二':'补丁验证的理论基础与评价指标','第五':'多前缀补丁排序的实验评估','第六':'成本感知补丁验证的对照实验设计',
          '3.1':'缺陷内补丁排序的问题定义','3.3':'代码修改差异与多前缀表征','4.1':'时间预算下的补丁选择问题',
          '5.1':'实验数据、划分与对照方法','5.2':'多前缀表征对正确性判别的影响','5.3':'首个正确补丁的排名与命中率','5.4':'固定预算下的验证耗时与正确候选保留率','5.5':'修复差异与多前缀表征的消融分析',
          '6.1':'研究问题与评估协议','6.2':'候选数据、正确性标注与项目划分','6.4':'分歧奖励的对照与消融设计','6.4.1':'相同预算下有无分歧奖励的配对比较','6.6':'按时间预算汇总的评估指标','6.7':'失败案例分析、跨项目验证与复现条件','6.7.3':'复现实验所需的数据与日志','7.3':'研究展望'}
          for k,title in names.items():
              p=head[k];old=text(p);e=entry(old)
              name=(k+"章" if k.startswith("第") else k)+"　"+title
              replace_title(e,name,True);replace_title(p,name)
          def get(s):return next(p for p in ps if text(p)==s)
          def clone(src,name,cache=False):
              p=deepcopy(src);replace_title(p,name,cache);return p
          # Use the existing heading and TOC styles; retain the current field result and tab stop.
          proto=head["5.1.1"]; proto_entry=entry(text(proto))
          a="5.5.1　已有消融结果及其解释"; b="5.5.2　修复差异与多位置状态的四组对照"
          head["5.5"].addnext(clone(proto,a))
          block=get("多前缀信号与修复前后差异的独立贡献")
          paras=[block.getnext()]
          for _ in range(2):paras.append(paras[-1].getnext())
          anchor=head["5.6"];anchor.addprevious(clone(proto,b))
          for p in paras:anchor.addprevious(p)
          body.remove(block)
          anchor=entry(text(head["5.6"]))
          for title in (a,b):anchor.addprevious(clone(proto_entry,title,True))
          block=get("相同时间预算下不确定性奖励的独立贡献")
          anchor=head["6.4.2"]
          for _ in range(3):anchor.addprevious(block.getnext())
          body.remove(block)
          def save():
              parts["word/document.xml"]=E.tostring(root,encoding="utf-8",xml_declaration=True,standalone=True)
              with zipfile.ZipFile(D,"w",zipfile.ZIP_DEFLATED) as z:
                  for k,v in parts.items():z.writestr(k,v)
          def render():
              with tempfile.TemporaryDirectory() as t:
                  subprocess.run(["libreoffice","-env:UserInstallation=file://"+t+"/profile","--headless","--convert-to","pdf","--outdir",t,str(D)],check=True)
                  D.with_suffix(".pdf").write_bytes((Path(t)/(D.stem+".pdf")).read_bytes())
              with fitz.open(D.with_suffix(".pdf")) as pdf:return [compact(p.get_text()) for p in pdf]
          bodytext=compact(text(head["1.1"].getnext()))[:28]
          for iteration in range(4):
              save();pages=render()
              start=next(i for i,p in enumerate(pages) if bodytext in p)
              changed=0
              for p in entries():
                  key=compact(label(p));t=ts(p)[-1];old=int(t.text)
                  hits=[j-start+1 for j in range(start,len(pages)) if key in pages[j]]
                  if not hits:raise ValueError("missing page for contents/list entry: "+key[:18])
                  new=min(hits,key=lambda j:abs(j-old));changed+=new!=old;t.text=str(new)
              if not changed:break
          else:raise RuntimeError("page numbers did not converge")
          for k in names:assert entry(text(head[k])) is not None
          assert not any(len(p)<12 for p in pages)
          print("Verified pages, contents/list entries, updated titles:",len(pages),len(entries()),len(names)+2)
      - name: Commit formatted draft
        run: |
          git add -- 毕业论文/*.docx 毕业论文/*.pdf
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Align thesis contents and experimental sections with both research questions'
          git push origin HEAD:thesis-evidence
