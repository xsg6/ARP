name: Inspect thesis paragraphs
on:
  push:
    branches: [thesis-evidence]
    paths: ['.github/workflows/inspect-thesis.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current draft
        shell: python
        run: |
          import glob,zipfile
          from xml.etree import ElementTree as E
          root=E.fromstring(zipfile.ZipFile(glob.glob('毕业论文/毕业论文初稿*.docx')[0]).read('word/document.xml'))
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          for i,p in enumerate(root.findall('w:body/w:p',ns)):
              text=''.join(x.text or '' for x in p.findall('.//w:t',ns))
              style=p.find('w:pPr/w:pStyle',ns)
              sid=style.get('{'+ns['w']+'}val','') if style is not None else ''
              if i in range(67,80) or i in [236,237,240,241,243,244,245,246,511,512,513,596,597,598,599,602,603,604,605,606,607] or 78<i<83:
                  print('META',i,sid,len(text),[a.tag.split('}')[-1] for a in p], 'fields',len(p.findall('.//w:fldChar',ns)),'runs',[(len(r.findall('w:t',ns)),len(''.join(t.text or '' for t in r.findall('w:t',ns)))) for r in p.findall('w:r',ns)][:12])
